name: Submit an AI-math result
description: Share one post or source link for manual review.
title: "[Submission]"
labels: ["submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: Paste one link to a social post, paper, repository, or announcement. We will analyze it ourselves and add suitable entries manually, so this can take some time.
  - type: input
    id: link
    attributes:
      label: Link to the post or source
      placeholder: https://x.com/... or any other public URL
    validations:
      required: true
